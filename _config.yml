# External plugins
plugins:
  - jekyll-paginate-v2
  - mini_magick

include: ['_pages']
exclude:
  - "/vendor/"
  - "/.idea/"
  - "/.claude/"
  - "/.devcontainer/"
  - "/utils/"
  - "*.sh"
  - "CLAUDE.md"
  - "plan.md"
  - "Dockerfile"
  - "Gemfile*"
  - "circle.yml"
  - "LICENSE.md"
  - "README.md"
  - "TRANSLATING.md"
  - "pagefind.exe"
  - "pagefind.yaml"
  - "/docs/"

destination: "./docs"
future: true

defaults:
  - scope:
      path: "_posts"
      type: "posts"
    values:
      locale: "en_US"
  - scope:
      path: "_posts/nl"
      type: "posts"
    values:
      locale: "nl_NL"
      permalink: /nl/:categories/:year/:month/:title/
  - scope:
      path: "_pages"
    values:
      locale: "en_US"

languages:
  - name: English
    short: EN
    locale: "en_US"
    index: "/"
  - name: Nederlands
    short: NL
    locale: "nl_NL"
    index: "/nl/"

# Site settings
title: 4DCu.be
subtitle: "a blog about programming, gaming, technology, ..."
email: sebastian.proost@gmail.com
name: Sebastian Proost
description: "A blog about Programming (mostly in Python), Machine Learning, Gaming, Technology and more."
baseurl: ""
url: "https://blog.4dcu.be"
cover: "/assets/header_image.webp"
logo: "/assets/icons/apple-icon-76x76.png"
sticker: "/assets/sticker_medium.webp"
sticker-1_5x: "/assets/sticker_middle.webp"
sticker-2x: "/assets/sticker_large.webp"

markdown: kramdown
inter_post_navigation: true
highlightjs_theme: "mono-blue"

pagination:
  enabled: true
  per_page: 7
  permalink: "/page/:num/"
  sort_reverse: true

